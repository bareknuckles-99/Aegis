name: Aegis AI Audit & Exploit
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target GitHub URL'
        required: true

jobs:
  engineer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai

      - name: Clone Target Repo
        run: git clone ${{ github.event.inputs.target_repo }} target_folder

      - name: Run Aegis Logic
        id: aegis_logic
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Save outputs to local files in the runner
          python aegis.py --path ./target_folder > audit_report.md
          # Assuming your python script creates exploit.t.sol

      - name: Upload Audit Results
        uses: actions/upload-artifact@v4
        with:
          name: audit-results
          path: |
            audit_report.md
            exploit.t.sol