<!DOCTYPE html>
<html>
<head>
    <title>🛡️ Aegis Security Portal</title>
    <style>
        body { background: #1a1a1a; color: #00ff00; font-family: 'Courier New', monospace; padding: 40px; }
        .container { max-width: 600px; margin: auto; border: 1px solid #00ff00; padding: 20px; box-shadow: 0 0 15px #00ff00; }
        input { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 12px; width: 80%; margin-bottom: 20px; }
        button { background: #00ff00; color: #000; padding: 12px 25px; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #00cc00; }
        #status { margin-top: 20px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ AEGIS v3.0</h1>
        <p>SYSTEM STATUS: <span style="color: #00ff00;">ONLINE</span></p>
        <hr color="#00ff00">
        <p>Enter Target Repository:</p>
        <input type="text" id="repoUrl" placeholder="https://github.com/owner/repo">
        <button onclick="triggerAudit()">INITIATE SEC-AUDIT</button>
        <div id="status">Ready for input...</div>
    </div>

    <script>
        async function triggerAudit() {
    const url = document.getElementById('repoUrl').value;
    
    // For a portfolio, the user (you) provides the token via prompt 
    // to keep the code "Serverless" and safe.
    const token = prompt("Enter your GitHub Access Token to start the cloud engine:");
    if (!token) return;

    const response = await fetch('https://api.github.com/repos/YOUR_USERNAME/Aegis/actions/workflows/audit.yml/dispatches', {
        method: 'POST',
        headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json'
        },
        body: JSON.stringify({ ref: 'main', inputs: { target_repo: url } })
    });

    if (response.ok) alert('Cloud Audit Engaged! Monitor the status below.');
}
    </script>
</body>
</html>
